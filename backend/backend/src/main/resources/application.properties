spring.application.name=bank-of-india-backend

# MySQL connection — update the database name, username, and password
# to match your local MySQL setup. The database itself must already exist;
# create it once with: CREATE DATABASE bankofindia;
spring.datasource.url=jdbc:mysql://localhost:3306/bankofindia?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=#Yashbro7

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# JWT — replace this secret before deploying anywhere real.
# Generate a strong one with: openssl rand -base64 64
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_BEFORE_ANY_REAL_USE_1234567890
app.jwt.expiration-ms=86400000

# Frontend origin allowed to call this API in dev
app.cors.allowed-origin=http://localhost:5173
